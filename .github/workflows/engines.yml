# Engines: builds Schnitzel's own Wine engine from CodeWeavers' CrossOver source drop.
#
# This file is part of Schnitzel, licensed under the GNU General Public License v3.0 or later.
# The full build plan is in SCHNITZEL_PLAN.md ("Own engine builds"). Milestone M1 sets up
# pinned inputs, the fetch-and-verify step, caching and the toolchain check; later
# milestones add the build, package, check and release jobs below them.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment), so a
# moved tag can't change what runs here.

name: Engines

on:
  push:
    branches: [main, own-engine-builds]
    paths:
      - "engines/**"
      - ".github/workflows/engines.yml"
  pull_request:
    paths:
      - "engines/**"
      - ".github/workflows/engines.yml"
  workflow_dispatch:
    inputs:
      # Releases are started by hand on a branch, not by pushing a tag: a tag's run can't read
      # the branch's caches and would rebuild everything (GitHub only shares a branch's and the
      # default branch's caches). The draft's tag is created when the draft is published.
      release:
        description: "Create a draft release with this engine version, e.g. 26.3.0-1 (empty: just build)"
        type: string
        default: ""
      rosetta:
        description: "Build on Apple Silicon under Rosetta 2 (the fallback if GitHub drops Intel runners)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push cancels the previous push's run, but never a run started by hand (a release or
# the Rosetta trial), which has a group of its own.
concurrency:
  group: engines-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  # Runner labels live here, in one place (see "Runners" in SCHNITZEL_PLAN.md for what to
  # do when GitHub retires an image). Later jobs read them from this job's outputs.
  config:
    name: Runner labels
    runs-on: ubuntu-latest
    outputs:
      build-runner: ${{ steps.labels.outputs.build-runner }}
      intel-runner: ${{ steps.labels.outputs.intel-runner }}
      arm-runner: ${{ steps.labels.outputs.arm-runner }}
      run: ${{ steps.labels.outputs.run }}
      toolchain-key: ${{ steps.toolchain.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The MinGW-w64 GCC toolchain only depends on its own pins and build script, so a change
      # to another input (a new CrossOver drop, say) doesn't rebuild the compiler.
      - id: toolchain
        run: |
          hash="$(python3 -c 'import json,hashlib; d=json.load(open("engines/inputs.json"))["inputs"]; ids=("binutils","gcc","mingw-w64","mpfr","mpc","gmp"); print(hashlib.sha256(json.dumps(sorted([(e["id"],e["sha256"]) for e in d if e["id"] in ids])).encode() + open("engines/scripts/build-toolchain.sh","rb").read() + open("engines/scripts/common.sh","rb").read()).hexdigest()[:20])')"
          echo "key=mingw-gcc-$hash" >> "$GITHUB_OUTPUT"
          echo "Toolchain cache key: mingw-gcc-$hash"
      - id: labels
        env:
          ROSETTA: ${{ inputs.rosetta }}
        run: |
          intel=macos-26-intel   # Intel x86_64; fallback: macos-15-intel
          arm=macos-26           # Apple Silicon, for the Rosetta checks
          echo "intel-runner=$intel" >> "$GITHUB_OUTPUT"
          echo "arm-runner=$arm" >> "$GITHUB_OUTPUT"
          # The build scripts run through this command: plain bash on Intel, or bash under
          # Rosetta 2 for the fallback build on Apple Silicon.
          if [[ "$ROSETTA" == "true" ]]; then
            echo "build-runner=$arm" >> "$GITHUB_OUTPUT"
            echo "run=arch -x86_64 /bin/bash" >> "$GITHUB_OUTPUT"
          else
            echo "build-runner=$intel" >> "$GITHUB_OUTPUT"
            echo "run=/bin/bash" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Check inputs.json and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check inputs.json
        run: python3 engines/scripts/fetch.py --check --summary "$GITHUB_STEP_SUMMARY"
      - name: Test the fetch script
        run: python3 -m unittest discover -s engines/tests -v

  inputs:
    name: Fetch and verify inputs
    needs: [config, validate]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Keyed by inputs.json: any change to a pin downloads again. Every later job restores
      # this same cache, so the large CrossOver drop is downloaded once per change.
      - name: Restore or create the inputs cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
      - name: Fetch and verify every input
        # Also re-checks files restored from the cache, so a damaged cache can't be used.
        run: python3 engines/scripts/fetch.py --dest engines/.cache/inputs
      - name: Disk space
        run: df -h . | tail -1

  mingw-gcc:
    name: MinGW-w64 GCC for ${{ matrix.arch }} (M1)
    needs: [config, inputs]
    strategy:
      matrix:
        arch: [i686, x86_64]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Restore the built toolchain
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-${{ matrix.arch }}
          key: engine-${{ needs.config.outputs.toolchain-key }}-${{ matrix.arch }}-${{ needs.config.outputs.build-runner }}
      - name: Restore the inputs cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Build binutils, MinGW-w64 and GCC
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ needs.config.outputs.run }} engines/scripts/build-toolchain.sh engines/.cache/inputs engines/build ${{ matrix.arch }}
      - name: Keep the logs of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-gcc-${{ matrix.arch }}-logs
          path: engines/build/work-toolchain-${{ matrix.arch }}/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Show the toolchain
        run: cat engines/build/mingw-gcc-${{ matrix.arch }}/versions.txt
      - name: Disk space
        if: always()
        run: df -h . | tail -1

  toolchain:
    name: Toolchain builds 32-bit and 64-bit programs
    needs: [config, inputs, mingw-gcc]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Restore the inputs cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Restore the 32-bit toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-i686
          key: engine-${{ needs.config.outputs.toolchain-key }}-i686-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Restore the 64-bit toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-x86_64
          key: engine-${{ needs.config.outputs.toolchain-key }}-x86_64-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Build and check the test programs
        run: ${{ needs.config.outputs.run }} engines/scripts/check-toolchain.sh engines/.cache/inputs engines/build
      - name: Keep the test programs for the prefix check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-programs
          path: engines/build/test-programs/*.exe
          retention-days: 7
          if-no-files-found: error

  # Each build job caches its output folder, keyed by the hash of everything that goes into
  # it, and skips the build when that cache exists. Folders move between jobs through the
  # cache, not artifacts: upload-artifact drops symlinks and file permissions.
  unix-libs:
    name: Unix libraries (M2)
    needs: [config, inputs]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - id: key
        run: echo "key=engine-unix-libs-${{ needs.config.outputs.build-runner }}-${{ hashFiles('engines/inputs.json', 'engines/scripts/common.sh', 'engines/scripts/build-unix-libs.sh', 'engines/scripts/check-unix-libs.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the built libraries
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/deps
          key: ${{ steps.key.outputs.key }}
      - name: Restore the inputs cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Build the libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ needs.config.outputs.run }} engines/scripts/build-unix-libs.sh engines/.cache/inputs engines/build
      - name: Check the libraries
        run: engines/scripts/check-unix-libs.sh engines/build/deps
      - name: Keep the configure logs of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-libs-logs
          path: engines/build/work-unix/**/config.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Disk space
        if: always()
        run: df -h . | tail -1

  moltenvk:
    name: MoltenVK (M3)
    needs: [config, inputs]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 120
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - id: key
        run: echo "key=engine-moltenvk-${{ needs.config.outputs.build-runner }}-${{ hashFiles('engines/inputs.json', 'engines/scripts/common.sh', 'engines/scripts/build-moltenvk.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the built MoltenVK
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/moltenvk
          key: ${{ steps.key.outputs.key }}
      - name: Restore the inputs cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Build MoltenVK
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ needs.config.outputs.run }} engines/scripts/build-moltenvk.sh engines/.cache/inputs engines/build
      - name: Show what it was built from
        run: cat engines/build/moltenvk/revisions.txt
      - name: Disk space
        if: always()
        run: df -h . | tail -1

  wine:
    name: Wine (M4)
    needs: [config, mingw-gcc, unix-libs, moltenvk]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 340
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - id: key
        # Wine is built against the libraries and MoltenVK, so their scripts are part of its key.
        run: echo "key=engine-wine-${{ needs.config.outputs.build-runner }}-${{ needs.config.outputs.toolchain-key }}-${{ hashFiles('engines/inputs.json', 'engines/scripts/common.sh', 'engines/scripts/build-unix-libs.sh', 'engines/scripts/check-unix-libs.sh', 'engines/scripts/build-moltenvk.sh', 'engines/scripts/build-wine.sh', 'engines/patches/wine/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the built Wine
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/wine
          key: ${{ steps.key.outputs.key }}
      - name: Restore the inputs cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Restore the built libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/deps
          key: ${{ needs.unix-libs.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the built MoltenVK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/moltenvk
          key: ${{ needs.moltenvk.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the 32-bit toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-i686
          key: engine-${{ needs.config.outputs.toolchain-key }}-i686-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Restore the 64-bit toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-x86_64
          key: engine-${{ needs.config.outputs.toolchain-key }}-x86_64-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Install bison and flex
        # Natively: Homebrew doesn't run under Rosetta on Apple Silicon.
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew list bison flex > /dev/null 2>&1 || brew install bison flex
      - name: Build Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ needs.config.outputs.run }} engines/scripts/build-wine.sh engines/.cache/inputs engines/build
      - name: Keep the logs of a failed build
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-logs
          path: |
            engines/build/work-wine/*.log
            engines/build/work-wine/build/config.log
            engines/build/work-wine/build/include/config.h
          retention-days: 7
          if-no-files-found: ignore
      - name: Disk space
        if: always()
        run: df -h . | tail -1

  package:
    name: Package and check the engine (M4)
    needs: [config, mingw-gcc, unix-libs, moltenvk, wine]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Engine version
        id: version
        # A release run names the version (<CrossOver version>-<build>); any other build is a
        # numbered development build that is never released.
        env:
          RELEASE: ${{ inputs.release }}
          ROSETTA: ${{ inputs.rosetta }}
        run: |
          crossover="$(python3 -c 'import json; print(next(i["version"] for i in json.load(open("engines/inputs.json"))["inputs"] if i["id"] == "crossover-sources"))')"
          if [[ -n "$RELEASE" ]]; then
            [[ "$ROSETTA" != "true" ]] || { echo "error: releases are built on Intel, not in the Rosetta trial" >&2; exit 1; }
            [[ "$RELEASE" =~ ^$crossover-[0-9]+$ ]] || { echo "error: release '$RELEASE' must be $crossover-<build number>" >&2; exit 1; }
            version="$RELEASE"
          else
            version="$crossover-dev.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Engine version: $version"
      - name: Restore the inputs cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - name: Restore the built libraries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/deps
          key: ${{ needs.unix-libs.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the built MoltenVK
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/moltenvk
          key: ${{ needs.moltenvk.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the built Wine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/wine
          key: ${{ needs.wine.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the 32-bit toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-i686
          key: engine-${{ needs.config.outputs.toolchain-key }}-i686-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Restore the 64-bit toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/build/mingw-gcc-x86_64
          key: engine-${{ needs.config.outputs.toolchain-key }}-x86_64-${{ needs.config.outputs.build-runner }}
          fail-on-cache-miss: true
      - name: Package, then check the package
        run: ${{ needs.config.outputs.run }} engines/scripts/package-engine.sh engines/.cache/inputs engines/build "${{ steps.version.outputs.version }}"
      - name: Keep the engine archive
        # A single archive file, so the artifact keeps symlinks and permissions inside it.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: engines/build/dist/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  check-prefix:
    name: Prefix check on ${{ matrix.machine }}
    needs: [config, toolchain, package]
    strategy:
      fail-fast: false
      matrix:
        machine: [Intel, Apple Silicon]
    runs-on: ${{ matrix.machine == 'Intel' && needs.config.outputs.intel-runner || needs.config.outputs.arm-runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rosetta 2
        if: runner.arch == 'ARM64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: engine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-programs
          path: test-programs
      - name: Check the archive's checksum
        run: cd engine && shasum -a 256 -c ./*.sha256
      - name: Create a prefix and run Windows programs
        run: engines/scripts/check-prefix.sh engine/schnitzel-engine-${{ needs.package.outputs.version }}.tar.xz test-programs "$RUNNER_TEMP/prefix-check"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prefix-check-logs-${{ runner.arch }}
          path: ${{ runner.temp }}/prefix-check/logs
          retention-days: 7
          if-no-files-found: ignore

  # Only for runs started with a release version, and only when the package check and both
  # prefix checks passed.
  # The release is a draft: Anston downloads it, installs it with Install from file in Schnitzel,
  # tests it, and only then publishes it by hand. Only this job may write to the repository.
  release:
    name: Draft release (M5)
    if: inputs.release
    needs: [config, package, check-prefix]
    runs-on: ${{ needs.config.outputs.build-runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the inputs cache
        # The exact sources are attached to the release (Wine and GnuTLS are LGPL).
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/.cache/inputs
          key: engine-inputs-${{ hashFiles('engines/inputs.json') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
          path: engine
      - name: Collect the release files
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          python3 engines/scripts/fetch.py --dest engines/.cache/inputs --milestone M4
          mkdir release
          cp "engine/schnitzel-engine-$VERSION.tar.xz" release/
          # Every source the engine was built from (not DXMT, which isn't in the engine).
          python3 -c 'import json; [print(i["file"]) for i in json.load(open("engines/inputs.json"))["inputs"] if i["id"] not in ("dxmt", "dxmt-license")]' \
            | while read -r file; do cp "engines/.cache/inputs/$file" release/; done
          (cd release && shasum -a 256 -- * > SHA256SUMS && cat SHA256SUMS)
          tar -xOf "release/schnitzel-engine-$VERSION.tar.xz" "schnitzel-engine-$VERSION/BUILDINFO.json" > BUILDINFO.json
          python3 engines/scripts/release-notes.py BUILDINFO.json release/SHA256SUMS \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: engine-${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          # The tag is created at this commit when the draft is published. If it already exists,
          # it must point here.
          existing="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "error: tag $TAG already exists at $existing, not at $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > is-draft.txt 2>/dev/null; then
            # Re-running the workflow refreshes the files of a draft, never of a published release.
            [[ "$(cat is-draft.txt)" == "true" ]] || { echo "error: $TAG is already published" >&2; exit 1; }
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --draft --target "$GITHUB_SHA" \
              --title "Schnitzel engine $VERSION" --notes-file notes.md
          fi
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
